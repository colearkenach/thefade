<form id="document-create" autocomplete="off">
    <div class="form-group"><label>{{localize "Name"}}</label><div class="form-fields"><input type="text" name="name" placeholder="{{defaultName}}" value="{{name}}" autofocus /></div></div>
    {{#if hasTypes}}
    <div class="form-group"><label>{{localize "Type"}}</label><div class="form-fields">
        <select name="type">{{#each itemFamilies as |family|}}<optgroup label="{{family.label}}">{{#each family.options as |option|}}<option value="{{option.value}}" {{#if (eq ../../type option.value)}}selected{{/if}}>{{option.label}}</option>{{/each}}</optgroup>{{/each}}</select>
    </div></div>
    {{/if}}
    {{#if hasFolders}}<div class="form-group"><label>{{localize "DOCUMENT.Folder"}}</label><div class="form-fields"><select name="folder">{{selectOptions folders selected=folder blank="" valueAttr="id" labelAttr="name"}}</select></div></div>{{/if}}
    {{{content}}}
</form>
