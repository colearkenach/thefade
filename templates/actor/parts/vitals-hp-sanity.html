<div class="vitals-strip vitals-strip-inline">
    <div class="vital-pill vital-hp vital-card hp-state-{{system.hp.state}}" style="--vital-fill: {{vitalPercent.hp}}%;">
        <div class="vital-emblem" aria-hidden="true"><i class="fas fa-heart"></i></div>
        <div class="vital-card-content">
        <label>HP <span class="vital-caption">Vitality</span></label>
        <div class="vital-values">
            <input type="text" {{#unless noName}}name="system.hp.value"{{/unless}} aria-label="Current HP" data-vital-path="system.hp.value" value="{{system.hp.value}}" data-dtype="Number" />
            <span class="sep">/</span>
            <input type="text" {{#unless noName}}name="system.hp.max"{{/unless}} aria-label="Maximum HP" value="{{system.hp.max}}" data-dtype="Number" disabled title="{{system.hp.formula}}" />
        </div>
        <div class="vital-track" aria-hidden="true"><span></span></div>
        </div>
        <div class="vital-card-tools">
        <span class="vital-bonus-label">Bonus</span>
        {{#if noName}}
        <input type="text" data-vital-path="system.hpMiscBonus" value="{{system.hpMiscBonus}}" data-dtype="Number" data-default-value="0" title="HP Misc Bonus" class="vital-bonus" placeholder="+0" />
        {{else}}
        <input type="text" name="system.hpMiscBonus" data-vital-path="system.hpMiscBonus" value="{{system.hpMiscBonus}}" data-dtype="Number" data-default-value="0" title="HP Misc Bonus" class="vital-bonus" placeholder="+0" />
        {{/if}}
        {{#if system.hp.stateLabel}}
        <span class="hp-state-badge hp-state-{{system.hp.state}}" title="HP State">{{system.hp.stateLabel}}</span>
        {{/if}}
        <button type="button" class="take-rest-btn" aria-label="Take a rest" title="Take a rest: roll 1d12 + Physique and restore that much HP"><i class="fas fa-bed"></i></button>
        </div>
    </div>

    <div class="vital-pill vital-sanity vital-card" style="--vital-fill: {{vitalPercent.sanity}}%;">
        <div class="vital-emblem" aria-hidden="true"><i class="fas fa-moon"></i></div>
        <div class="vital-card-content">
        <label>Sanity <span class="vital-caption">Clarity</span></label>
        <div class="vital-values">
            <input type="text" {{#unless noName}}name="system.sanity.value"{{/unless}} aria-label="Current Sanity" data-vital-path="system.sanity.value" value="{{system.sanity.value}}" data-dtype="Number" />
            <span class="sep">/</span>
            <input type="text" {{#unless noName}}name="system.sanity.max"{{/unless}} aria-label="Maximum Sanity" value="{{system.sanity.max}}" data-dtype="Number" disabled title="{{system.sanity.formula}}" />
        </div>
        <div class="vital-track" aria-hidden="true"><span></span></div>
        </div>
        <div class="vital-card-tools">
        <span class="vital-bonus-label">Bonus</span>
        {{#if noName}}
        <input type="text" data-vital-path="system.sanity.miscBonus" value="{{system.sanity.miscBonus}}" data-dtype="Number" data-default-value="0" title="Sanity Misc Bonus" class="vital-bonus" placeholder="+0" />
        {{else}}
        <input type="text" name="system.sanity.miscBonus" data-vital-path="system.sanity.miscBonus" value="{{system.sanity.miscBonus}}" data-dtype="Number" data-default-value="0" title="Sanity Misc Bonus" class="vital-bonus" placeholder="+0" />
        {{/if}}
        </div>
    </div>
</div>
